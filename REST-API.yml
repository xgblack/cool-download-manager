openapi: 3.0.0
info:
  title: Download Service API
  version: 1.2.0
  description: |
    Local HTTP API for managing download tasks and queues. X-Api-Key authentication
    is enabled by default on every route, including ping. Empty configured keys
    prevent authenticated HTTP startup. Legacy anonymous configurations pause HTTP
    until the user enables authentication or explicitly accepts anonymous local access
    in Settings. Confirmed anonymous mode permits only ping, queue reads and /add
    requests that open user confirmation. /start-headless-download, source updates
    and /add with silentAdd or silentStart always require a nonempty matching key,
    even in anonymous mode. These unauthorized commands return 401 without calling
    the download handler. Anonymous clients performing silent commands must now send
    X-Api-Key; a key can be managed in Settings while ordinary authentication is off.
    Native Messaging uses the private same-user socket and does not require this key.
    Only HTTP/1.1 origin-form requests are accepted, with one Host header matching
    localhost, 127.0.0.1 or [::1] and the configured port. Browser Origin, when present,
    must exactly match an http loopback authority on that port; no CORS opt-in is given.
    Requests are limited to 4 MiB including headers (16 KiB maximum headers), 32
    simultaneous connections and 10 seconds total connection lifetime. Chunked
    requests, duplicate headers, malformed lengths and pipelining are rejected.
    Invalid framing returns 400, oversized input 413, untrusted Host/Origin 403,
    and missing or incorrect keys 401. Excess or expired connections are closed.
    Stopping cancels accepted connections and owned tasks; already committed commands
    are not rolled back. Listener failures are displayed in the application.
security:
  - ApiKeyAuth: []
servers:
  - url: http://localhost:15151
    description: Default server running on port 15151

paths:
  /ping:
    post:
      summary: Check the local service
      description: Requires a key by default; available without one in confirmed anonymous mode.
      responses:
        "200":
          description: The local service is reachable.
          content:
            text/plain:
              schema:
                type: string
                example: pong
        "401":
          $ref: "#/components/responses/Unauthorized"

  /add:
    post:
      summary: Add download sources through browser integration
      description: |
        By default, opens the application confirmation window. A legacy source array
        is equivalent to an object with both options false. In confirmed anonymous
        mode, interactive requests may omit the key; setting either silentAdd or
        silentStart to true always requires X-Api-Key. silentStart requests should
        also set silentAdd to bypass the confirmation window and start immediately.
      requestBody:
        required: true
        description: Download sources with optional silent execution flags.
        content:
          application/json:
            schema:
              oneOf:
                - type: array
                  items:
                    $ref: "#/components/schemas/DownloadSource"
                - type: object
                  required: [items]
                  properties:
                    items:
                      type: array
                      items:
                        $ref: "#/components/schemas/DownloadSource"
                    options:
                      type: object
                      properties:
                        silentAdd:
                          type: boolean
                          default: false
                          description: Create tasks without opening confirmation.
                        silentStart:
                          type: boolean
                          default: false
                          description: Start tasks created by silentAdd.
      responses:
        "200":
          description: Successfully added the download
          content:
            text/plain:
              schema:
                type: string
                description: OK on success
        "401":
          $ref: "#/components/responses/Unauthorized"

  /queues:
    get:
      summary: Get list of download queues
      description: Requires a key by default; available without one in confirmed anonymous mode.
      responses:
        "200":
          description: List of download queues
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: The unique ID of the queue
                    name:
                      type: string
                      description: The name of the queue
        "401":
          $ref: "#/components/responses/Unauthorized"
  /start-headless-download:
    post:
      summary: Add a new download task
      description: Always requires X-Api-Key, including in confirmed anonymous mode and when startDownload is false.
      requestBody:
        required: true
        description: Data for adding a download task
        content:
          application/json:
            schema:
              type: object
              required: [downloadSource]
              properties:
                downloadSource:
                  $ref: "#/components/schemas/DownloadSource"
                folder:
                  type: string
                  description: Optional folder to save the download (Unix style path)
                name:
                  type: string
                  description: Optional name for the download task
                queueId:
                  type: integer
                  description: Optional queue ID to associate the task with
                categoryId:
                  type: integer
                  description: Optional category ID to associate the task with
                startDownload:
                  type: boolean
                  default: false
                  description: Start the new task immediately.
                startQueue:
                  type: boolean
                  default: false
                  description: Start the associated queue.
      responses:
        "200":
          description: Successfully added the download task
          content:
            text/plain:
              schema:
                type: string
                description: OK on success
        "401":
          $ref: "#/components/responses/Unauthorized"

  /downloads/{id}/source:
    patch:
      summary: Replace an existing task's request source
      description: |
        Always requires X-Api-Key, including in confirmed anonymous mode. Probes the
        replacement source and preserves downloaded bytes only when resource identity
        can be proven.
      security:
        - ApiKeyAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [link]
              properties:
                link:
                  type: string
                  format: uri
                  maxLength: 8192
                  description: Replacement HTTP or HTTPS source URL.
                headers:
                  type: object
                  maxProperties: 64
                  additionalProperties:
                    type: string
                    maxLength: 8192
                  description: Complete replacement request headers; old authentication headers are not merged.
      responses:
        "200":
          description: Source updated. The task may continue or remain paused.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [id, status, continued]
                properties:
                  id:
                    type: integer
                    format: int64
                  status:
                    type: string
                    enum: [added, preparing, downloading, paused, retrying, waitingForSourceRefresh, completed, failed, cancelled]
                  continued:
                    type: boolean
        "400":
          description: Malformed JSON, URL, headers, or path parameters.
          content:
            text/plain:
              schema:
                type: string
                example: Invalid request
        "401":
          description: X-Api-Key is missing or invalid.
          content:
            text/plain:
              schema:
                type: string
                example: Unauthorized
        "404":
          description: The task does not exist or the route is not an exact match.
          content:
            text/plain:
              schema:
                type: string
                example: Not Found
        "409":
          description: Task state, resource identity, or resume support prevents a safe update.
          content:
            text/plain:
              schema:
                type: string
                example: Source update conflict
        "500":
          description: Secure credential storage or metadata persistence failed.
          content:
            text/plain:
              schema:
                type: string
                example: Request failed

components:
  responses:
    Unauthorized:
      description: X-Api-Key is missing, empty or incorrect. Protected commands require a key in anonymous mode too.
      content:
        text/plain:
          schema:
            type: string
            example: Unauthorized
  schemas:
    DownloadSource:
      type: object
      required: [link]
      properties:
        type:
          type: string
          enum: [http, hls]
          default: http
        link:
          type: string
          format: uri
          description: HTTP or HTTPS download source URL.
        headers:
          type: object
          additionalProperties:
            type: string
          description: Optional task request headers, including authentication when needed.
        downloadPage:
          type: string
          format: uri
          description: Optional HTTP or HTTPS download page URL.
        suggestedName:
          type: string
          description: Optional filename supplied by the caller.
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
